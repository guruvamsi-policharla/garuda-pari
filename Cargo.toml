[package]
name = "zkpari"
version = "0.1.0"
description = "An implementation of the ZK-Pari SNARK"
categories = ["cryptography"]
license = "MIT/Apache-2.0"
edition = "2021"

################################# Dependencies ################################

[dependencies]
ark-std = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-relations = { version = "0.6.0", default-features = false }
merlin = { version = "3.0.0", default-features = false }
displaydoc = { version = "0.2.3", default-features = false }
rayon = { version = "1.5.2" }

[dev-dependencies]
# Curves for tests, examples, and benchmarks
ark-bls12-381 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-crypto-primitives = { version = "0.6", features = ["sponge", "constraints"] }
ark-r1cs-std = "0.6"

[[bench]]
name = "batch_verify"
path = "benches/batch_verify.rs"
harness = false

[[bench]]
name = "prover"
path = "benches/prover.rs"
harness = false

[[bench]]
name = "circuits"
path = "benches/circuits.rs"
harness = false

[features]
default = ["std", "parallel"]
std = ["ark-ff/std", "ark-poly/std", "ark-relations/std", "ark-std/std", "ark-serialize/std"]
print-trace = ["ark-std/print-trace"]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
]
