[package]
name = "zkpari"
version = "0.1.0"
description = "An implementation of the ZK-Pari SNARK"
categories = ["cryptography"]
license = "MIT/Apache-2.0"
edition = "2021"

################################# Dependencies ################################

[dependencies]
# NOTE: pinned to 0.5 because ark-relations (gr1cs, git master) still requires ark 0.5
ark-std = { version = "^0.5.0", default-features = false }
ark-serialize = { version = "^0.5.0", default-features = false, features = ["derive"] }
ark-ff = { version = "^0.5.0", default-features = false }
ark-ec = { version = "^0.5.0", default-features = false }
ark-poly = { version = "^0.5.0", default-features = false }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", default-features = false }
merlin = { version = "3.0.0", default-features = false }
displaydoc = { version = "0.2.3", default-features = false }
rayon = { version = "1.5.2" }

[dev-dependencies]
# Curves for tests, examples, and benchmarks
ark-bls12-381 = { version = "^0.5.0", default-features = false, features = ["curve"] }
ark-bn254 = { version = "^0.5.0", default-features = false, features = ["curve"] }
# Rescue circuit for the benchmarks
ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git", default-features = false, features = [
    "constraints",
    "snark",
    "crh",
] }
ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std.git", default-features = false, features = ["std"] }
num-bigint = "0.4"
# Benchmark result CSV output
csv = "1.2"
serde_json = "1.0"

[[bench]]
name = "rescue-pari"
path = "benches/rescue-pari.rs"
harness = false

[[bench]]
name = "batch-verify-pari"
path = "benches/batch-verify-pari.rs"
harness = false

[[bench]]
name = "parallel-batch-verify-pari"
path = "benches/parallel-batch-verify-pari.rs"
harness = false

[[bench]]
name = "prove-verify-compare"
path = "benches/prove-verify-compare.rs"
harness = false

[[bench]]
name = "ledger-block"
path = "benches/ledger-block.rs"
harness = false

[features]
default = ["std", "parallel"]
std = ["ark-ff/std", "ark-poly/std", "ark-relations/std", "ark-std/std", "ark-serialize/std"]
print-trace = ["ark-std/print-trace"]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
]
################################ Patches #######################################

# The algebra crates are patched to a pinned post-0.5 revision of the arkworks
# master: its MSM is ~17% faster than the published 0.5.0
[patch.crates-io]
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra.git", rev = "8de9a9d9ba52566b1ba5637fbd1b3ce98dad17e8" }
